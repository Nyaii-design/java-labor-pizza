<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Bejelentkezés')}"></head>
<body>
<nav th:replace="~{fragments :: menu('login')}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h2 class="oldal-cim text-center"><i class="bi bi-box-arrow-in-right"></i> Bejelentkezés</h2>
            <div th:if="${param.registered}" class="alert alert-success">Sikeres regisztráció! Most már bejelentkezhetsz.</div>
            <div th:if="${param.error}" class="alert alert-danger">Hibás felhasználónév vagy jelszó!</div>
            <div th:if="${param.logout}" class="alert alert-info">Sikeresen kijelentkeztél.</div>
            <div class="card shadow-sm"><div class="card-body">
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Felhasználónév</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jelszó</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Bejelentkezés</button>
                </form>
            </div></div>
            <p class="text-center mt-3">Még nincs fiókod? <a th:href="@{/register}">Regisztrálj!</a></p>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: lablec}"></footer>
</body>
</html>
