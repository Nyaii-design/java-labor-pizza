# Helyi kipróbálás IntelliJ-ből: memóriában futó H2 adatbázis, nem kell hozzá MySQL.
# Ezt a profilt a PizzaApplication.main() kapcsolja be; a szerveren (WAR) nem használjuk.
spring.datasource.url=jdbc:h2:mem:pizza;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
