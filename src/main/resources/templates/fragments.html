<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Közös <head>: Bootswatch "United" ingyenes reszponzív téma (Bootstrap 5) -->
<head th:fragment="head(cim)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${cim} + ' – Net Pizzéria'">Net Pizzéria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/united/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sajat.css}">
</head>

<!-- Felső menü: a menüpontok a szerepkör szerint jelennek meg -->
<nav th:fragment="menu(aktiv)" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🍕 Net Pizzéria</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#fomenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="fomenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'fooldal'} ? active" th:href="@{/}">Főoldal</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'adatbazis'} ? active" th:href="@{/adatbazis}">Adatbázis</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'kapcsolat'} ? active" th:href="@{/kapcsolat}">Kapcsolat</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:classappend="${aktiv == 'uzenetek'} ? active" th:href="@{/uzenetek}">Üzenetek</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'diagram'} ? active" th:href="@{/diagram}">Diagram</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:classappend="${aktiv == 'crud'} ? active" th:href="@{/crud}">CRUD</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'rest'} ? active" th:href="@{/rest}">REST</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:classappend="${aktiv == 'login'} ? active" th:href="@{/login}"><i class="bi bi-box-arrow-in-right"></i> Login</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:classappend="${aktiv == 'register'} ? active" th:href="@{/register}"><i class="bi bi-person-plus"></i> Regisztráció</a></li>
                <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-2">
                        <i class="bi bi-person-circle"></i> <span sec:authentication="name">felhasználó</span>
                        <span sec:authorize="hasRole('ADMIN')" class="badge bg-warning text-dark">admin</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Kijelentkezés</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Lábléc: készítők neve és Neptun-kódja minden oldalon -->
<footer th:fragment="lablec" class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <div>Készítették: <strong th:text="${keszitok}">Név (NEPTUN)</strong></div>
        <small class="text-secondary">Java alkalmazások – gyakorlat beadandó · NJE GAMF · 2026</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
